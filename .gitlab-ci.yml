stages:
  - deploy
  - catalog

deploy-salesforce:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash curl jq openssl
  script:
    - bash scripts/rest/deploy-apex-class.sh
  after_script:
    - mv scripts/rest/deploy.env deploy.env || true
  artifacts:
    reports:
      dotenv: deploy.env
  # Required CI/CD variables (Settings > CI/CD > Variables), all masked/protected:
  #   SF_CLIENT_ID      - Consumer Key of the Connected App / External Client App
  #   SF_USERNAME       - Salesforce USERNAME (Setup > Users), not the email
  #   SF_JWT_KEY_FILE   - type "File", content = the RSA private key (server.key)
  #   SF_LOGIN_URL      - optional, defaults to https://login.salesforce.com

